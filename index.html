<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FLAME FOMO</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #fbf6f1;
      --surface: #fff;
      --ink: #2a1a14;
      --mute: #7a665c;
      --line: #eadfd6;
      --flame: #e8431f;
      --flame-ink: #fff;
      --amber: #f5a524;
      --teal: #0f7b6c;
      --warn: #b3261e;
      --warnbg: #fde9e6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a110d;
        --surface: #26180f;
        --ink: #f6e9e0;
        --mute: #b79d90;
        --line: #3d2a1f;
        --flame: #ff6a45;
        --flame-ink: #1a0d08;
        --amber: #ffbf47;
        --teal: #4fd1bd;
        --warn: #ff9a90;
        --warnbg: #4a1f1a
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a110d;
      --surface: #26180f;
      --ink: #f6e9e0;
      --mute: #b79d90;
      --line: #3d2a1f;
      --flame: #ff6a45;
      --flame-ink: #1a0d08;
      --amber: #ffbf47;
      --teal: #4fd1bd;
      --warn: #ff9a90;
      --warnbg: #4a1f1a
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 Figtree, system-ui, sans-serif
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 90px
    }

    h1,
    h2,
    h3 {
      font-family: 'Bricolage Grotesque', Figtree, sans-serif;
      margin: 0;
      line-height: 1.1
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -.03em
    }

    h1 span {
      color: var(--flame)
    }

    .sub {
      color: var(--mute);
      margin: 6px 0 18px
    }

    nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      display: flex;
      gap: 6px;
      background: var(--bg);
      padding: 8px 0;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px
    }

    nav button {
      flex: none;
      border: 0;
      background: none;
      color: var(--mute);
      font: 600 .95rem Figtree;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer
    }

    nav button[aria-selected=true] {
      background: var(--ink);
      color: var(--bg)
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 22px
    }

    .chip {
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 99px;
      font: 500 .9rem Figtree;
      cursor: pointer
    }

    .chip[aria-pressed=true] {
      background: var(--flame);
      border-color: var(--flame);
      color: var(--flame-ink)
    }

    .pick {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 6px solid var(--flame);
      border-radius: 6px 18px 18px 6px;
      padding: 16px;
      margin-bottom: 14px
    }

    .pick .tag {
      font-weight: 600;
      color: var(--flame);
      font-size: .9rem
    }

    .pick h3 {
      font-size: 1.45rem;
      margin: 4px 0
    }

    .meta {
      color: var(--mute);
      font-size: .92rem
    }

    .why {
      font-size: .88rem;
      color: var(--teal);
      margin-top: 6px
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .btn {
      border: 1.5px solid var(--ink);
      background: none;
      color: var(--ink);
      font: 600 .9rem Figtree;
      padding: 8px 14px;
      border-radius: 99px;
      cursor: pointer
    }

    .btn.pri {
      background: var(--flame);
      border-color: var(--flame);
      color: var(--flame-ink)
    }

    .btn.on {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--bg)
    }

    .clash {
      background: var(--warnbg);
      color: var(--warn);
      font-size: .85rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 8px
    }

    .ev {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: space-between
    }

    .ev h3 {
      font-size: 1.05rem
    }

    .day {
      font-family: 'Bricolage Grotesque';
      font-weight: 700;
      font-size: 1.2rem;
      margin: 22px 0 8px
    }

    .src {
      font-size: .75rem;
      background: var(--line);
      color: var(--mute);
      padding: 2px 8px;
      border-radius: 99px;
      margin-left: 4px
    }

    .days {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px
    }

    .dbtn {
      flex: none;
      min-width: 84px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 14px;
      padding: 8px 12px;
      text-align: left;
      font: inherit;
      cursor: pointer
    }

    .dbtn b {
      display: block;
      font-family: 'Bricolage Grotesque';
      font-size: 1.05rem
    }

    .dbtn span {
      font-size: .78rem;
      color: var(--mute)
    }

    .dbtn[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg)
    }

    .dbtn[aria-pressed=true] span {
      color: var(--bg)
    }

    .venues {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px
    }

    .venues .card {
      margin: 0
    }

    .mapbox {
      position: relative;
      border: 1px solid var(--line);
      margin-top: 10px
    }

    .mapbox img {
      display: block;
      width: 100%;
      border-radius: 14px
    }

    .route {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .r1 {
      stroke: #fff;
      stroke-width: 7;
      stroke-linecap: round
    }

    .r2 {
      stroke: #1a73e8;
      stroke-width: 3.5;
      stroke-dasharray: 2 7;
      stroke-linecap: round
    }

    .pin.go {
      background: var(--teal);
      color: var(--bg)
    }

    .pin[data-tip]:hover::after,
    .pin[data-tip]:focus-visible::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 135%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      font: 500 .78rem/1.35 Figtree;
      padding: 6px 10px;
      border-radius: 8px;
      white-space: pre-line;
      width: max-content;
      max-width: 230px;
      text-align: left;
      z-index: 9
    }

    .pin:hover,
    .pin:focus-visible {
      z-index: 8
    }

    .reg {
      font-size: .85rem;
      font-weight: 600;
      margin-top: 6px;
      color: var(--teal)
    }

    .reg.soon {
      color: #b86e00
    }

    .reg.bad {
      color: var(--warn)
    }

    .reg.ok {
      color: var(--teal)
    }

    .pin {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 26px;
      height: 26px;
      border-radius: 99px;
      border: 2px solid #fff;
      background: var(--flame);
      color: var(--flame-ink);
      font: 700 .8rem Figtree;
      cursor: pointer;
      padding: 0 6px
    }

    .pin.sel {
      background: var(--ink);
      color: var(--bg);
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 2
    }

    .me {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--teal);
      color: var(--bg);
      font: 700 .7rem Figtree;
      padding: 2px 8px;
      border-radius: 99px;
      border: 2px solid #fff;
      z-index: 1
    }

    .ts {
      align-items: stretch;
      gap: 14px;
      justify-content: flex-start
    }

    .tsb {
      flex: 1;
      min-width: 0
    }

    .mini {
      flex: none;
      width: 150px;
      height: 110px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-image: var(--m);
      background-size: 600px auto;
      position: relative;
      overflow: hidden
    }

    .mini i {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--flame);
      border: 2px solid #fff;
      transform: translate(-50%, -50%)
    }

    .bar {
      height: 6px;
      border-radius: 9px;
      background: var(--line);
      margin: 8px 0 4px;
      overflow: hidden
    }

    .bar b {
      display: block;
      height: 100%;
      background: var(--flame)
    }

    @media(max-width:480px) {
      .ts {
        flex-direction: column
      }
    }

    .tl {
      position: relative;
      height: 768px;
      margin: 14px 0 10px 46px;
      border-left: 1px solid var(--line);
      background: repeating-linear-gradient(to bottom, transparent 0 47px, var(--line) 47px 48px)
    }

    .hl {
      position: absolute;
      left: -46px;
      width: 40px;
      text-align: right;
      font-size: .72rem;
      color: var(--mute);
      transform: translateY(-50%)
    }

    .blk {
      position: absolute;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: .8rem;
      overflow: hidden;
      line-height: 1.25
    }

    .blk.bz {
      background: repeating-linear-gradient(45deg, var(--line) 0 6px, var(--surface) 6px 12px);
      border: 1px solid var(--mute);
      color: var(--ink)
    }

    .blk.gz {
      background: var(--teal);
      color: var(--bg)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .empty {
      color: var(--mute);
      padding: 20px;
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      text-align: center
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px
    }

    label {
      display: block;
      font-weight: 600;
      font-size: .9rem;
      margin: 12px 0 4px
    }

    input,
    select {
      width: 100%;
      font: inherit;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      color: var(--ink)
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .sw {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .sw:last-child {
      border: 0
    }

    .sw small {
      color: var(--mute);
      display: block
    }

    .tg {
      width: 48px;
      height: 28px;
      border-radius: 99px;
      border: 0;
      background: var(--line);
      position: relative;
      cursor: pointer;
      flex: none
    }

    .tg::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--surface);
      transition: transform .15s
    }

    .tg[aria-checked=true] {
      background: var(--teal)
    }

    .tg[aria-checked=true]::after {
      transform: translateX(20px)
    }

    #log {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 240px;
      margin-bottom: 12px
    }

    .m {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      white-space: pre-line
    }

    .m.u {
      align-self: flex-end;
      background: var(--flame);
      color: var(--flame-ink);
      border-bottom-right-radius: 4px
    }

    .m.b {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px
    }

    .cf {
      display: flex;
      gap: 8px
    }

    .cf input {
      flex: 1
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 99px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    .toast.show {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

      main.innerHTML = top + ((S.loading && !S.events.length) ? '<div class="empty">Loading events…</div>' : V[S.tab]()); save();
      const l = $('#log'); if (l) l.scrollTop = l.scrollHeight;
    }
    function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800) }
    function parseTime(s) { const m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i); if (!m) return null; let h = +m[1]; const ap = (m[3] || '').toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; if (!ap && h < 8) h += 12; return h * 60 + (+m[2] || 0) }
    function bot(q) {
      const l = q.toLowerCase();
      const ev = live().filter(e => !S.hidden.includes(e.id));
      const fmt = a => a.length ? a.sort((x, y) => x.d - y.d || x.s - y.s).map(e => `${CATS[e.c][0]} ${e.t}, ${e.d ? dayName(e.d) + ' ' : ''}${tm(e.s)}, ${e.p}`).join('\n') : '';
      if (/clash|conflict|overlap/.test(l)) {
        const g = ev.filter(e => S.going.includes(e.id)), out = [];
        g.forEach(a => g.forEach(b => { if (a.id < b.id && clashes(a, b)) out.push(`${a.t} and ${b.t} overlap`) }));
        return out.length ? out.join('\n') : g.length ? 'No clashes in your plan.' : 'You haven\'t picked anything yet, so nothing can clash.';
      }
      const at = l.match(/free (?:at|around)?\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/);
      if (at) { const m = parseTime(at[1]); const bb = ab().filter(b => b.d === 0 && b.s <= m && m < b.e); if (bb.length) return 'Not at ' + tm(m) + ': you have ' + bb[0].t + '.'; const busy = ev.filter(e => S.going.includes(e.id) && e.d === 0 && e.s <= m && m < e.e); return busy.length ? `Not at ${tm(m)}: you're going to ${busy[0].t}.` : `Yes, you're free at ${tm(m)}. Ask “what's on today?” to fill it.`; }
      if (/regist|deadline|seat|closing|limit/.test(l)) { const a = ev.filter(e => { const r = regInfo(e); return r && r.open }).sort((x, y) => x.dl - y.dl).slice(0, 6); return a.length ? a.map(e => { const r = regInfo(e); return e.t + ': ' + r.left + ' seats left, closes in ' + r.when }).join('\n') : 'No open registrations right now.' }
      let r = ev;
      if (/tomorrow/.test(l)) r = r.filter(e => e.d === 1); else if (/today|tonight|now/.test(l)) r = r.filter(e => e.d === 0);
      const cat = Object.keys(CATS).find(c => l.includes(c.toLowerCase())) || (/creative|art|craft/.test(l) ? 'Arts' : /volunteer|help|impact/.test(l) ? 'Impact' : /meet|people|friends|social/.test(l) ? 'Social' : /sport|game|football/.test(l) ? 'Sports' : null);
      if (cat) r = r.filter(e => e.c === cat);
      if (/going|plan/.test(l)) return fmt(ev.filter(e => S.going.includes(e.id))) || 'Your plan is empty.';
      if (/what|show|any|event|happen|list|tonight|today|tomorrow|%/.test(l) || cat) return fmt(r) || 'Nothing matching that. ';
      return 'I can list events by day or type, check clashes, or check if you\'re free at a time. Try “what\'s on tomorrow?”';
    }
    document.addEventListener('click', ev => {
      const t = ev.target.closest('button'); if (!t) return; const D = t.dataset;
      if (D.tab) { S.tab = D.tab; render() }
      else if (D.v) { S.sel = D.v; render() }
      else if (D.reg) { doReg(D.reg) }
      else if (D.retry) { loadEvents() }
      else if (D.back) { S.auth = { step: 'email', email: S.auth.email }; S.authErr = null; render() }
      else if (D.dir) { const e = S.events.find(x => x.id === D.dir); S.sel = e.p; S.day = e.d <= 4 ? e.d : 0; S.tab = 'map'; render(); window.scrollTo(0, 0) }
      else if (D.og) { S.og = !S.og; render() }
      else if (D.conn) { connect(D.conn); toast(S.conn[D.conn] ? 'Connected. Your calendar is updated' : 'Disconnected'); render() }
      else if (D.so) { signOut() }
      else if (D.rs) { S.senders.splice(+D.rs, 1); render() }
      else if (D.rb) { S.busy = S.busy.filter(b => b.id !== D.rb); render() }
      else if (D.cd) { S.cd = +D.cd; render() }
      else if (D.day) { S.day = +D.day; render() }
      else if (D.day === '') { }
      else if (D.go) { goToggle(D.go) }
      else if (D.skip) { hideEv(D.skip) }
      else if (D.int) { setInt(D.int) }
      else if (D.src) { S.src[D.src] = !S.src[D.src]; render() }
      else if (t.id === 'reset') { try { localStorage.removeItem('fomo6') } catch (e) { } location.reload() }
    });
    document.addEventListener('change', ev => {
      if (ev.target.id === 'rf') { S.rf = ev.target.value; render() }
      if (ev.target.id === 'me') { S.me = ev.target.value || null; render() }
    });
    document.addEventListener('submit', ev => {
      ev.preventDefault();
      if (ev.target.id === 'cf') { const v = $('#ci').value.trim(); if (!v) return; S.chat.push(['u', v], ['b', bot(v)]); render(); $('#ci').focus() }
      if (ev.target.id === 'of1') otpReq($('#oe').value.trim().toLowerCase());
      if (ev.target.id === 'of2') otpVerify($('#oc').value.trim(), $('#on').value.trim() || undefined);
      if (ev.target.id === 'sf') { const v = $('#si').value.trim().toLowerCase(); if (v && !S.senders.includes(v)) S.senders.push(v); render() }
      if (ev.target.id === 'bf') {
        const s = parseTime($('#bs').value), e = parseTime($('#be').value);
        if (e <= s) { toast('End time must be after start'); return }
        S.busy.push({ id: 'b' + Date.now(), d: +$('#bd').value, t: $('#bt').value.trim(), s, e, src: 'me' }); S.cd = +$('#bd').value; toast('Busy time added'); render()
      }
    });
    document.documentElement.style.setProperty('--m', 'url(' + MAPIMG + ')');
    render(); boot();
  </script>
